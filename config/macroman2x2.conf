# Impostazioni utente per il macropad. Modifica qui e ricompila.

# Deep sleep: dopo 15 minuti di inattivita' la board si spegne quasi del tutto,
# si risveglia premendo un tasto (kscan e' dichiarato wakeup-source).
CONFIG_ZMK_SLEEP=y
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Solo USB (disattiva il Bluetooth) -> scommenta le due righe seguenti.
# CONFIG_ZMK_BLE=n
# CONFIG_ZMK_USB=y
