---
include:
  # Firmware "normale": lampeggia questo se non ti serve ZMK Studio.
  - board: seeeduino_xiao_ble
    shield: macroman2x2
    artifact-name: macroman2x2

  # Variante con ZMK Studio (rimappatura dal browser via USB, senza ricompilare).
  # Locking disattivato perche' con 4 tasti non conviene sacrificarne uno per &studio_unlock.
  - board: seeeduino_xiao_ble
    shield: macroman2x2
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n
    artifact-name: macroman2x2_studio
